[workspace]
members = [
    "game_engine",
    "server", 
    "client_desktop",
]

resolver = "2"

[workspace.dependencies]
rand_core = "0.6"
getrandom = "0.2"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"
toml = "0.8"
chacha20poly1305 = "0.10"
egui = "0.27"
eframe = "0.27"
uuid = { version = "1.0", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }